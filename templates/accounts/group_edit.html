{% extends "base.html" %}
{% block title %}{{ title }} · {{ group.name }}{% endblock %}
{% block content %}<p class="breadcrumb"><a href="{% url 'accounts:group_workspace' group.pk %}">← 返回 {{ group.name }}</a></p><section class="panel"><h1 class="panel-title">{{ title }}</h1><form method="post" class="form-grid">{% csrf_token %}{{ form.non_field_errors }}{% for field in form %}<div class="form-group"><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.errors }}</div>{% endfor %}<div class="form-actions"><button class="btn btn-primary" type="submit">儲存變更</button><a class="btn btn-outline" href="{% url 'accounts:group_workspace' group.pk %}">取消</a></div></form></section>{% endblock %}
